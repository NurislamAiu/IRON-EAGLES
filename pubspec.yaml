name: ArcheoAI
description: "For Iron Eagles fll team"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0
  provider: ^6.1.1
  go_router: ^12.1.1
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  audioplayers: ^5.2.1
  cached_network_image: ^3.3.0
  image_picker: ^1.0.4
  another_flushbar: ^1.12.32
  model_viewer_plus: ^1.10.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geocoding: ^4.0.0
  mobile_scanner: ^7.2.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/
    - assets/3d/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"